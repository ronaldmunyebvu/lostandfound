<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Information Display</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .user-card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 15px;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }

        .user-card:hover {
            transform: scale(1.02); /* Slightly enlarge on hover */
        }

        .user-info {
            margin: 5px 0;
            font-size: 14px;
            color: #555;
        }

        .no-data {
            text-align: center;
            padding: 15px;
            background-color: #f9d6d6;
            color: #dc3545;
            border-radius: 5px;
        }

        .cancel-btn {
            background-color: #dc3545;
            padding: 10px 15px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 14px;
            display: block;
            margin: 20px auto;
        }

        .cancel-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <h1>Document Details</h1>

    <div id="user-entries">
        <div class="user-card" th:each="users : ${users}">
            <p class="user-info"><strong>First Name:</strong> <span th:text="${users.fname}"></span></p>
            <p class="user-info"><strong>Last Name:</strong> <span th:text="${users.lname}"></span></p>
            <p class="user-info">
                <strong>National ID or Passport Number:</strong> 
                <span th:text="${users.nationalid != null && users.nationalid.length() >= 6 ? 
                users.nationalid.substring(0, 2) + '****' + users.nationalid.substring(6) : 
                'N/A'}"></span>
            </p>
            <p class="user-info"><strong>Location:</strong> <span th:text="${users.location}"></span></p>
            <p class="user-info"><strong>Document Name:</strong> <span th:text="${users.documentname}"></span></p>
            <p class="user-info"><strong>Contact Number:</strong> <span th:text="${users.contactnumber}"></span></p>
        </div>

        <div th:if="${#lists.isEmpty(users)}" class="no-data">No document found. Please enter the correct name.</div>
    </div>

    <button type="button" class="cancel-btn" onclick="window.location.href='/'">Back</button>
</body>
</html>
