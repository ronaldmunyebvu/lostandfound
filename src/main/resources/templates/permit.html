<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Information Table</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden; /* Round the corners of the table */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #4a90e2; /* Header background color */
            color: white;
            text-transform: uppercase; /* Uppercase for headers */
            letter-spacing: 0.1em; /* Slight spacing between letters */
        }

        tr {
            transition: background-color 0.3s; /* Smooth transition for row hover */
        }

        tr:hover {
            background-color: #f1f1f1; /* Light gray on hover */
        }

        .button-container {
            display: flex;
            justify-content: space-around; /* Space buttons evenly */
        }

        .edit-button, .delete-button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            transition: background-color 0.3s, transform 0.2s;
        }

        .edit-button {
            background-color: #28a745; /* Green for edit */
        }

        .edit-button:hover {
            background-color: #218838; /* Darker green on hover */
            transform: scale(1.05);
        }

        .delete-button {
            background-color: #dc3545; /* Red for delete */
        }

        .delete-button:hover {
            background-color: #c82333; /* Darker red on hover */
            transform: scale(1.05);
        }

        img {
            width: 80px; /* Set a fixed width for images */
            height: auto; /* Maintain aspect ratio */
            border-radius: 5px; /* Slightly round the corners */
        }

        .no-data {
            text-align: center;
            padding: 15px;
            background-color: #f9d6d6; /* Light red background */
            color: #dc3545; /* Red text color */
            border-radius: 5px; /* Rounded corners */
        }
         .cancel-btn {
            background-color: #dc3545;
            flex: 1;
            margin-left: 10px;
        }
        .cancel-btn:hover {
            background-color: #c82333;
        }
           .manage-button {
            padding: 12px;
            font-size: 16px;
            color: white; /* Text color */
            background-color: #007bff; /* Button color */
            border: none; /* No border */
            border-radius: 5px; /* Rounded corners */
            cursor: pointer; /* Pointer cursor on hover */
            text-decoration: none; /* No underline for links */
            transition: background-color 0.3s, transform 0.2s; /* Smooth transition */
            margin-top: 1px;
        }
        .manage-button:hover {
            background-color: #0056b3; /* Darker blue on hover */
            transform: scale(1.05); /* Slightly enlarge */
        }
        .manage-button:active {
            transform: scale(0.95); /* Slightly shrink when clicked */
        }
        .faint {
            opacity: 0.5; /* Make the input field faint */
        }
    </style>
</head>
<body>
    <h1>Available Documents</h1>
      <a href="/adminsearch" class="manage-button">Search Document</a><br><br>
    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>National ID or passport number</th>
                <th>Location</th>
                <th>Document Name</th>
                <th>Contact Number</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="users : ${users}">
                <td th:text="${users.fname}"></td>
                <td th:text="${users.lname}"></td>
                <td th:text="${users.nationalid}"></td>
                <td th:text="${users.location}"></td>
                <td th:text="${users.documentname}"></td>
                <td th:text="${users.contactnumber}"></td>
               
                <td>
                    <div class="button-container">
                        <a th:href="@{/edit(id=${users.id})}" class="edit-button">Edit</a>
                        <form th:action="@{/delete/{id}(id=${users.id})}" method="post" style="display:inline;">
                            <button type="submit" class="delete-button">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="6" class="no-data">No documents found. Please enter the correct name.</td>
            </tr>
        </tbody>
    </table>
    
   <button type="button" class="cancel-btn" onclick="window.location.href='/'">Back</button>
</body>
</html>
